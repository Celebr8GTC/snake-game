<!DOCTYPE html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #2a3348, #0f1626 70%);
    font-family: Arial, Helvetica, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #wrap { transform-origin: center center; display: flex; flex-direction: column; align-items: center; }

  /* ---- Nokia 3310 body (shell, silver surround, logo, earpiece and mic are drawn in the SVG) ---- */
  .phone { position: relative; width: 300px; height: 710px; flex: none; }
  .shell { position: absolute; inset: 0; width: 300px; height: 710px; overflow: visible; pointer-events: none;
    filter: drop-shadow(0 26px 30px rgba(0,0,0,.55)) drop-shadow(0 4px 6px rgba(0,0,0,.4)); }

  /* screen window: dark frame + LCD with the curved bottom edge */
  .bezel { position: absolute; left: 31px; top: 177px; width: 238px; padding: 3px;
    border-radius: 9px 9px 50% 50% / 9px 9px 24px 24px;
    background: linear-gradient(180deg, #1b2130, #2b3346 60%, #3a4357);
    box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 1px 0 1px rgba(255,255,255,.08), inset 0 1px 3px rgba(0,0,0,.8); }
  .lcd { position: relative; padding: 4px 4px 5px; border-radius: 6px 6px 50% 50% / 6px 6px 21px 21px;
    background: radial-gradient(ellipse at 50% 45%, #b9d24c 0%, #a3c13b 55%, #86a52b 100%);
    box-shadow: inset 0 0 12px rgba(40,60,0,.55), inset 0 2px 4px rgba(0,0,0,.35); color: #1f2a0d; font-family: "Courier New", monospace; font-weight: 700; overflow: hidden; }
  .lcd::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background-image: linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.04) 1px, transparent 1px);
    background-size: 3px 3px; }
  .hud, .soft { display: flex; justify-content: space-between; font-size: 13px; line-height: 15px; }
  .hud { padding: 0 3px; }
  .soft { justify-content: center; font-size: 14px; margin-top: 1px; letter-spacing: .5px; }
  /* playfield flanked by the 3310 idle indicators: signal (left) and battery (right) */
  .scr { display: grid; grid-template-columns: 14px minmax(0, 1fr) 14px; column-gap: 3px; align-items: end; }
  .ind { display: block; fill: #1f2a0d; margin-bottom: 2px; }
  /* smooth when the 288px canvas is drawn smaller than its pixels (keeps text clean), crisp blocks on high-DPI screens */
  canvas { display: block; width: 100%; height: auto; image-rendering: auto; }
  @media (min-resolution: 2dppx) { canvas { image-rendering: pixelated; } }

  /* ---- keys (shared) ---- */
  .nav, .pad { position: absolute; inset: 0; pointer-events: none; }
  .nav > *, .pad > * { pointer-events: auto; }
  .key { position: absolute; border: none; cursor: pointer; font-family: Arial, Helvetica, sans-serif; color: #1d4b29;
    transform: rotate(var(--r, 0deg));
    background: radial-gradient(120% 90% at 35% 25%, #ffffff 0%, #e4e7ec 35%, #c3c8d0 75%, #a7adb8 100%);
    box-shadow: 0 0 0 2px #121a2c, 0 0 0 3px rgba(80,96,130,.45), inset 0 -2px 3px rgba(60,70,90,.45), inset 0 1px 1px rgba(255,255,255,.9); }
  .key:active, .key.down { transform: rotate(var(--r, 0deg)) translateY(1.5px) scale(.97); filter: brightness(.86); }

  /* Navi key: big silver oval with the blue bar */
  .navi { position: absolute; left: 89px; top: 366px; width: 122px; height: 33px; border: none; cursor: pointer; border-radius: 50%;
    background: radial-gradient(110% 120% at 50% 15%, #f4f6f9 0%, #d4d9e2 40%, #aab2c1 85%, #8f98a9 100%);
    box-shadow: 0 0 0 2px #1a2236, 0 0 0 3px rgba(255,255,255,.25), inset 0 -3px 4px rgba(40,55,90,.45), inset 0 2px 2px rgba(255,255,255,.9); }
  .navi::after { content: ""; position: absolute; left: 50%; top: 9px; width: 50px; height: 4px; margin-left: -25px; border-radius: 3px;
    background: linear-gradient(180deg, #7cc4ff, #2c8be0 60%, #1d6fc0); box-shadow: 0 0 4px rgba(60,160,255,.6); }
  .navi:active, .navi.down { transform: translateY(1.5px) scale(.98); filter: brightness(.88); }

  /* C key (left) and the up/down scroll rocker (right), angled along the silver surround */
  .ckey { left: 45px; top: 395px; width: 54px; height: 32px; --r: 28deg; border-radius: 9px 12px 12px 9px / 12px 12px 12px 12px; }
  .ckey .cmark { position: absolute; left: 21px; top: 9px; width: 10px; height: 14px; border-radius: 50%;
    border-left: 3px solid #1d4b29; transform: rotate(-28deg); }
  .rocker { position: absolute; left: 174px; top: 402px; width: 90px; height: 36px; transform: rotate(-29deg);
    display: flex; flex-direction: row-reverse; border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 0 2px #121a2c, 0 0 0 3px rgba(80,96,130,.45); }
  .rocker { background: radial-gradient(90% 120% at 40% 15%, #ffffff 0%, #e2e6eb 35%, #c0c6cf 75%, #a3aab6 100%); }
  .rocker .key { position: relative; flex: 1; height: 100%; border-radius: 0; --r: 0deg; box-shadow: none; background: transparent; }
  .rocker .key:active, .rocker .key.down { transform: none; filter: none; background: rgba(20,30,60,.16); }
  .rocker .mk { position: absolute; width: 9px; height: 9px; border: 0 solid #1d4b29; }
  .rocker #spdUp .mk { right: 12px; top: 9px; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 8px; }
  .rocker #spdDn .mk { left: 12px; bottom: 9px; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 8px; }
  .rocker::after { content: ""; position: absolute; inset: 0; border-radius: 12px; pointer-events: none;
    box-shadow: inset 0 -2px 3px rgba(60,70,90,.45), inset 0 1px 1px rgba(255,255,255,.9); }

  /* 12-key pad in the 3310's "smile" layout: side columns tilted, centre column lower */
  .pad .key { width: 58px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; gap: 2px; padding-top: 1px; }
  .pad .key.mid { width: 62px; height: 33px; }
  .pad .key.l { --r: 15deg; } .pad .key.r { --r: -15deg; flex-direction: row-reverse; }
  .pad b, .pad .arrow { font-weight: 900; font-size: 17px; line-height: 1; }
  .pad small { font-weight: 700; font-size: 9.5px; line-height: 1; letter-spacing: .2px; }
  .pad .key.l b, .pad .key.l .arrow, .pad .key.r b, .pad .key.r .arrow { transform: translateY(-4px); }
  .pad .key.l small, .pad .key.r small { transform: translateY(3px); }
  .pad .key.mid small { transform: translateY(1px); }
  .pad .key.tall { flex-direction: column; align-items: flex-start; gap: 0; padding-left: 14px; }
  .pad .key.tall b { transform: none; } .pad .key.tall small { transform: none; margin-left: 9px; margin-top: -1px; }
  .pad svg { display: block; fill: none; stroke: #1d4b29; stroke-width: 1.6; }
  .pad .key.r svg, .pad .key.l svg { transform: translateY(3px); margin: 0 1px; }

  .hint { color: #7d89a6; font-size: 11px; margin-top: 12px; text-align: center; line-height: 1.5; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #a3c13b; color: #1f2a0d;
    font-weight: 700; padding: 10px 16px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.5); display: none; z-index: 9; white-space: nowrap; }
</style>
</head>

<script>
const C = 12, W = 24, H = 14;
const DARK = '#1f2a0d', LCD = '#a8c53e';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), softEl = document.getElementById('soft');
const DIRS = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
const SPEEDS = [['Slow', 170], ['Normal', 120], ['Fast', 80]];
let snake, dir, queue, food, score, state = 'title', spd = +(localStorage.getItem('snakeSpeed') ?? 1), walls = localStorage.getItem('snakeWalls') === '1', timer;
let best = +localStorage.getItem('nokiaSnakeBest') || 0;
const pad4 = n => String(n).padStart(4, '0');
bestEl.textContent = 'HI ' + pad4(best);

// scale the phone to fit any screen
function fit() {
  const w = document.getElementById('wrap'); w.style.transform = 'none';
  const s = Math.min(1.35, (innerHeight * 0.97) / w.offsetHeight, (innerWidth * 0.97) / w.offsetWidth);
  w.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

function reset() {
  snake = [[6,7],[5,7],[4,7],[3,7]]; dir = 'right'; queue = []; score = 0;
  placeFood(); scoreEl.textContent = pad4(0);
}
function placeFood() {
  do { food = [Math.floor(Math.random()*W), Math.floor(Math.random()*H)]; }
  while (snake.some(s => s[0] === food[0] && s[1] === food[1]));
}
function setSoft() { softEl.textContent = { title: 'Start', play: 'Pause', pause: 'Resume', over: 'Retry' }[state]; }
function start() { reset(); state = 'play'; setSoft(); loop(); }
function loop() { clearTimeout(timer); if (state !== 'play') return; step(); draw(); timer = setTimeout(loop, SPEEDS[spd][1]); }

function step() {
  if (queue.length) dir = queue.shift();
  let [x, y] = snake[0]; x += DIRS[dir][0]; y += DIRS[dir][1];
  if (walls) { if (x < 0 || y < 0 || x >= W || y >= H) return die(); }
  else { x = (x + W) % W; y = (y + H) % H; }
  const eating = x === food[0] && y === food[1];
  const body = eating ? snake : snake.slice(0, -1);
  if (body.some(s => s[0] === x && s[1] === y)) return die();
  snake.unshift([x, y]);
  if (eating) { score += 10; scoreEl.textContent = pad4(score); buzz(20); placeFood(); }
  else snake.pop();
}
function die() {
  state = 'over'; setSoft(); buzz([60, 40, 60]);
  if (score > best) { best = score; localStorage.setItem('nokiaSnakeBest', best); bestEl.textContent = 'HI ' + pad4(best); }
}
function buzz(p) { if (navigator.vibrate) navigator.vibrate(p); }

function block(x, y) { ctx.fillRect(x*C + 1, y*C + 1, C - 2, C - 2); }
function drawHead() {
  const [hx, hy] = snake[0], [dx, dy] = DIRS[dir];
  ctx.save(); ctx.translate(hx*C + C/2, hy*C + C/2); ctx.rotate(Math.atan2(dy, dx));
  ctx.fillStyle = DARK; ctx.beginPath();
  ctx.moveTo(-C/2, -C/2 + 0.5); ctx.lineTo(0, -C/2 + 0.5);
  ctx.arc(0, 0, C/2 - 0.5, -Math.PI/2, Math.PI/2);
  ctx.lineTo(-C/2, C/2 - 0.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = LCD; ctx.fillRect(0, -4, 2, 2); ctx.fillRect(0, 2, 2, 2);
  ctx.fillStyle = DARK; ctx.fillRect(C/2, -0.5, 3, 1); ctx.fillRect(C/2 + 3, -2, 1, 1.5); ctx.fillRect(C/2 + 3, 0.5, 1, 1.5);
  ctx.restore();
}
function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = DARK;
  if (walls) { ctx.strokeStyle = DARK; ctx.lineWidth = 2; ctx.strokeRect(1, 1, cv.width-2, cv.height-2); }
  if (state === 'title') return text(['SNAKE', 'Speed: ' + SPEEDS[spd][0], 'Walls: ' + (walls ? 'On' : 'Off')]);
  snake.slice(1).forEach(([x, y]) => block(x, y));
  drawHead();
  const [fx, fy] = food, cx = fx*C + C/2, cy = fy*C + C/2;
  ctx.fillStyle = DARK; ctx.beginPath(); ctx.moveTo(cx, cy-5); ctx.lineTo(cx+5, cy); ctx.lineTo(cx, cy+5); ctx.lineTo(cx-5, cy); ctx.fill();
  if (state === 'pause') text(['PAUSED']);
  if (state === 'over') text(['GAME OVER', 'Score ' + score]);
}
function text(lines) {
  if (state !== 'title') { ctx.fillStyle = 'rgba(168,197,62,.88)'; ctx.fillRect(24, 34, cv.width-48, cv.height-68); }
  ctx.fillStyle = DARK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => {
    ctx.font = i === 0 ? 'bold 28px "Courier New", monospace' : 'bold 15px "Courier New", monospace';
    ctx.fillText(l, cv.width/2, cv.height/2 - (lines.length-1)*13 + i*26 + (i ? 4 : 0));
  });
}
function turn(d) {
  if (state !== 'play') return;
  const last = queue.length ? queue[queue.length-1] : dir;
  const [a, b] = DIRS[d], [c, e] = DIRS[last];
  if (a === -c && b === -e) return;
  if (d !== last && queue.length < 3) queue.push(d);
}
function steer(d) { if (state === 'title' || state === 'over') start(); turn(d); }
function ok() {
  if (state === 'play') { state = 'pause'; draw(); }
  else if (state === 'pause') { state = 'play'; loop(); }
  else start();
  setSoft();
}
function speed(delta) {
  if (state === 'play') return;
  spd = Math.max(0, Math.min(2, spd + delta)); localStorage.setItem('snakeSpeed', spd);
  toast('Speed: ' + SPEEDS[spd][0], 1200); draw();
}
function toggleWalls() {
  if (state === 'play') return;
  walls = !walls; localStorage.setItem('snakeWalls', walls ? '1' : '0');
  toast('Walls: ' + (walls ? 'On' : 'Off'), 1200); draw();
}

// keyboard
const KEYS = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right', '2':'up', '8':'down', '4':'left', '6':'right' };
document.addEventListener('keydown', e => {
  const btn = document.querySelector(`[data-k="${e.key}"]`); if (btn) { btn.classList.add('down'); setTimeout(() => btn.classList.remove('down'), 120); }
  if (KEYS[e.key]) { e.preventDefault(); steer(KEYS[e.key]); }
  else if (e.key === ' ' || e.key === 'Enter' || e.key === '5') { e.preventDefault(); ok(); }
  else if (e.key === 'c' || e.key === 'C' || e.key === 'Backspace') toggleWalls();
  else if (e.key === '+' || e.key === '=') speed(1); else if (e.key === '-') speed(-1);
});
// on-screen keys
const tap = (el, fn) => el.addEventListener('pointerdown', e => { e.preventDefault(); fn(); });
document.querySelectorAll('[data-dir]').forEach(b => tap(b, () => steer(b.dataset.dir)));
document.querySelectorAll('[data-ok]').forEach(b => tap(b, ok));
tap(document.getElementById('navi'), ok);
tap(document.getElementById('ckey'), toggleWalls);
tap(document.getElementById('spdUp'), () => speed(1));
tap(document.getElementById('spdDn'), () => speed(-1));
// swipe on the screen
let sx, sy;
cv.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
cv.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return ok();
  steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
reset(); draw(); setSoft();

// ---- Installable app + over-the-air updates ----
const APP_VERSION = '1.2.0';
function toast(msg, ms = 3000) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const check = () => reg.update().catch(() => {});
    setInterval(check, 30 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  });
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    localStorage.setItem('snakeUpdated', '1');
    if (state === 'play') return;                 // never interrupt a game; applies next launch
    reloading = true; location.reload();
  });
}
if (localStorage.getItem('snakeUpdated')) { localStorage.removeItem('snakeUpdated'); setTimeout(() => toast('Updated to v' + APP_VERSION + ' ✨'), 300); }
</script>
</body>
