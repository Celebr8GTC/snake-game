<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<meta name="theme-color" content="#22343f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1f2a30; font-family: "Courier New", monospace; user-select: none; touch-action: none;
  }
  .phone {
    background: linear-gradient(180deg, #2f4858, #22343f); padding: 26px 22px 22px;
    border-radius: 48px 48px 60px 60px; box-shadow: 0 20px 50px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.1);
    text-align: center;
  }
  .brand { color: #cfd8dc; font-family: Arial, sans-serif; font-weight: 700; letter-spacing: 4px; font-size: .9rem; margin-bottom: 12px; }
  .screen { background: #c7f0d8; padding: 8px; border-radius: 8px; border: 6px solid #10181c; }
  .hud { display: flex; justify-content: space-between; color: #43523d; font-weight: 700; font-size: 1rem; padding: 0 2px 4px; }
  canvas { display: block; background: #c7f0d8; image-rendering: pixelated; width: 100%; height: auto; }
  .opts { display: flex; gap: 6px; justify-content: center; margin: 14px 0 10px; flex-wrap: wrap; }
  .opts button {
    background: #3e5866; color: #e0e6e8; border: none; border-radius: 12px; padding: 6px 10px;
    font-family: Arial, sans-serif; font-size: .8rem; cursor: pointer;
  }
  .opts button.active { background: #c7f0d8; color: #43523d; font-weight: 700; }
  .pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 46px); gap: 6px; justify-content: center; }
  .pad button {
    background: #dfe6e9; border: none; border-radius: 14px; font-size: 1.1rem; color: #2f4858; font-weight: 700;
    box-shadow: 0 3px 0 #90a4ae; cursor: pointer;
  }
  .pad button:active { transform: translateY(2px); box-shadow: 0 1px 0 #90a4ae; }
  .pad .mid { background: #c7f0d8; font-size: .75rem; }
  .hint { color: #90a4ae; font-family: Arial, sans-serif; font-size: .72rem; margin-top: 10px; }
  .ver { color: #607d8b; font-family: Arial, sans-serif; font-size: .65rem; margin-top: 4px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #c7f0d8; color: #43523d;
    font-family: Arial, sans-serif; font-weight: 700; padding: 10px 16px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.4); display: none; z-index: 9; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
</style>
</head>
<body>
<div class="phone">
  <div class="brand">SNAKE</div>
  <div class="screen">
    <div class="hud"><span id="score">0000</span><span id="best">HI 0000</span></div>
    <canvas id="c" width="336" height="240"></canvas>
  </div>
  <div class="opts">
    <button data-speed="160">Slow</button>
    <button data-speed="110" class="active">Normal</button>
    <button data-speed="70">Fast</button>
    <button id="walls">Walls: Off</button>
  </div>
  <div class="pad">
    <span></span><button data-dir="up">▲</button><span></span>
    <button data-dir="left">◀</button><button class="mid" id="ok">OK</button><button data-dir="right">▶</button>
    <span></span><button data-dir="down">▼</button><span></span>
  </div>
  <div class="hint">Arrow keys / WASD or swipe · Space to pause</div>
  <div class="ver" id="ver">v1.0.0</div>
</div>
<div class="toast" id="toast"></div>
<script>
const C = 12, W = 28, H = 20;               // cell size, grid width/height
const DARK = '#43523d', LIGHT = '#c7f0d8';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
const DIRS = { up: [0,-1], down: [0,1], left: [-1,0], right: [1,0] };
let snake, dir, queue, food, score, state = 'title', speed = 110, walls = false, timer;
let best = +localStorage.getItem('nokiaSnakeBest') || 0;
const pad = n => String(n).padStart(4, '0');
bestEl.textContent = 'HI ' + pad(best);

function reset() {
  snake = [[6,10],[5,10],[4,10],[3,10]]; dir = 'right'; queue = []; score = 0;
  placeFood(); scoreEl.textContent = pad(0);
}
function placeFood() {
  do { food = [Math.floor(Math.random()*W), Math.floor(Math.random()*H)]; }
  while (snake.some(s => s[0] === food[0] && s[1] === food[1]));
}
function start() { reset(); state = 'play'; loop(); }
function loop() { clearTimeout(timer); if (state !== 'play') return; step(); draw(); timer = setTimeout(loop, speed); }

function step() {
  if (queue.length) dir = queue.shift();
  let [x, y] = snake[0]; x += DIRS[dir][0]; y += DIRS[dir][1];
  if (walls) { if (x < 0 || y < 0 || x >= W || y >= H) return die(); }
  else { x = (x + W) % W; y = (y + H) % H; }
  const eating = x === food[0] && y === food[1];
  const body = eating ? snake : snake.slice(0, -1);
  if (body.some(s => s[0] === x && s[1] === y)) return die();
  snake.unshift([x, y]);
  if (eating) { score += 10; scoreEl.textContent = pad(score); buzz(20); placeFood(); }
  else snake.pop();
}
function die() {
  state = 'over'; buzz([60, 40, 60]);
  if (score > best) { best = score; localStorage.setItem('nokiaSnakeBest', best); bestEl.textContent = 'HI ' + pad(best); }
}
function buzz(p) { if (navigator.vibrate) navigator.vibrate(p); }

function block(x, y) { ctx.fillRect(x*C + 1, y*C + 1, C - 2, C - 2); }
function draw() {
  ctx.fillStyle = LIGHT; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = DARK;
  if (walls) { ctx.strokeStyle = DARK; ctx.lineWidth = 2; ctx.strokeRect(1, 1, cv.width-2, cv.height-2); }
  if (state === 'title') return text(['SNAKE', '', 'Press OK or Space', 'to start']);
  snake.slice(1).forEach(([x, y]) => block(x, y));
  drawHead();
  // food: little diamond
  const [fx, fy] = food, cx = fx*C + C/2, cy = fy*C + C/2;
  ctx.beginPath(); ctx.moveTo(cx, cy-5); ctx.lineTo(cx+5, cy); ctx.lineTo(cx, cy+5); ctx.lineTo(cx-5, cy); ctx.fill();
  if (state === 'pause') text(['PAUSED']);
  if (state === 'over') text(['GAME OVER', 'Score ' + score, '', 'Press OK to retry']);
}
function drawHead() {
  const [hx, hy] = snake[0], px = hx*C, py = hy*C, [dx, dy] = DIRS[dir];
  ctx.save(); ctx.translate(px + C/2, py + C/2);
  ctx.rotate(Math.atan2(dy, dx));            // face the travel direction (drawn facing right)
  ctx.fillStyle = DARK;
  ctx.beginPath();                            // rounded snout, square back
  ctx.moveTo(-C/2, -C/2 + 0.5); ctx.lineTo(0, -C/2 + 0.5);
  ctx.arc(0, 0, C/2 - 0.5, -Math.PI/2, Math.PI/2);
  ctx.lineTo(-C/2, C/2 - 0.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = LIGHT;                      // eyes
  ctx.fillRect(0, -4, 2, 2); ctx.fillRect(0, 2, 2, 2);
  ctx.fillStyle = DARK;                       // forked tongue
  ctx.fillRect(C/2, -0.5, 3, 1); ctx.fillRect(C/2 + 3, -2, 1, 1.5); ctx.fillRect(C/2 + 3, 0.5, 1, 1.5);
  ctx.restore();
}
function text(lines) {
  ctx.fillStyle = 'rgba(199,240,216,.85)'; ctx.fillRect(30, 60, cv.width-60, cv.height-120);
  ctx.fillStyle = DARK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => {
    ctx.font = i === 0 ? 'bold 26px "Courier New", monospace' : 'bold 14px "Courier New", monospace';
    ctx.fillText(l, cv.width/2, cv.height/2 - (lines.length-1)*11 + i*22);
  });
}
function turn(d) {
  if (state !== 'play') return;
  const last = queue.length ? queue[queue.length-1] : dir;
  const [a, b] = DIRS[d], [c, e] = DIRS[last];
  if (a === -c && b === -e) return;          // no reversing into yourself
  if (d !== last && queue.length < 3) queue.push(d);
}
function ok() {
  if (state === 'play') { state = 'pause'; draw(); }
  else if (state === 'pause') { state = 'play'; loop(); }
  else start();
}
const KEYS = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right' };
document.addEventListener('keydown', e => {
  if (KEYS[e.key]) { e.preventDefault(); if (state === 'title' || state === 'over') start(); turn(KEYS[e.key]); }
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); ok(); }
});
document.querySelectorAll('[data-dir]').forEach(b => b.addEventListener('pointerdown', e => {
  e.preventDefault(); if (state === 'title' || state === 'over') start(); turn(b.dataset.dir);
}));
document.getElementById('ok').addEventListener('pointerdown', e => { e.preventDefault(); ok(); });
let sx, sy;
cv.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
cv.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return ok();
  if (state === 'title' || state === 'over') start();
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-speed]').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); speed = +b.dataset.speed; b.blur();
});
const wb = document.getElementById('walls');
wb.onclick = () => { walls = !walls; wb.textContent = 'Walls: ' + (walls ? 'On' : 'Off'); wb.classList.toggle('active', walls); wb.blur(); if (state !== 'play') draw(); };
reset(); draw();

// ---- Installable app + over-the-air updates ----
const APP_VERSION = '1.0.0';
function toast(msg, ms = 3000) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const check = () => reg.update().catch(() => {});
    setInterval(check, 30 * 60 * 1000);                       // check every 30 min while open
    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });  // and whenever reopened
  });
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    if (state === 'play') { localStorage.setItem('snakeUpdated', '1'); return; }  // don't interrupt a game; applies next launch
    reloading = true; localStorage.setItem('snakeUpdated', '1'); location.reload();
  });
}
if (localStorage.getItem('snakeUpdated')) { localStorage.removeItem('snakeUpdated'); setTimeout(() => toast('Updated to v' + APP_VERSION + ' ✨'), 300); }
</script>
</body>
</html>
